<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>"
    />
    <title>Tua conta, Casa Coffee Colab</title>
    <meta name="description" content="Tua conta no Casa Coffee Colab: teus dados, teus pontos e teu plano." />
    <meta name="robots" content="noindex" />
  </head>
  <body data-requires-auth>
    <!-- Header injetado pelo app.js -->
    <div id="site-header"></div>

    <section class="section">
      <div class="wrap" style="max-width: 920px">
        <!-- Conteúdo injetado pelo app.js (initPerfilPage), depois do guard de auth.
             Enquanto carrega/checa a sessão, mostra um aviso gentil. -->
        <div data-perfil-root>
          <p style="text-align:center; color: var(--muted)">só um instante, abrindo tua conta…</p>
        </div>
      </div>
    </section>

    <!-- Footer injetado pelo app.js -->
    <div id="site-footer"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
