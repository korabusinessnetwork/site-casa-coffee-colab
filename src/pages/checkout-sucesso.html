<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>"
    />
    <title>Pagamento confirmado, Casa Coffee Colab</title>
    <meta name="description" content="Teu pagamento no Casa Coffee Colab foi confirmado." />
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!-- Header injetado pelo app.js -->
    <div id="site-header"></div>

    <main>
      <section class="section">
        <div class="wrap">
          <!-- data-checkout-sucesso: o app.js limpa o carrinho ao carregar aqui e
               especializa o título/texto conforme o fluxo (loja/assinatura/upgrade). -->
          <div
            class="reveal"
            style="max-width: 560px; margin: 0 auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px"
            data-checkout-sucesso
          >
            <span class="icon-badge lg green">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1L12 21l8.8-8.3a5 5 0 0 0 0-7.1z" />
              </svg>
            </span>
            <span class="eyebrow green">Confirmado</span>

            <!-- Copy neutra (serve loja E assinatura). O app.js especializa por fluxo
                 (assinatura=1 → boas-vindas ao plano; ref → pedido; upgrade=1 → turbinado). -->
            <h1 class="title lg" data-sucesso-titulo>pagamento confirmado 💛</h1>
            <p class="lede" data-sucesso-texto style="max-width: 48ch">
              deu tudo certo por aqui. o que tu comprou aparece na tua conta em
              instantes, assim que o pagamento termina de conversar com a gente.
            </p>

            <!-- Pontos creditados (preenchido pelo app.js quando o webhook processar).
                 Só a classe "hidden" controla a visibilidade (app.js faz
                 classList.remove('hidden')) — o visual vem por style pontual, pra não
                 disputar cascata com nenhuma classe de componente. -->
            <p
              class="hidden"
              data-pontos-credito
              style="
                margin: 4px 0 0;
                padding: 10px 20px;
                border-radius: 999px;
                background: color-mix(in srgb, var(--green) 14%, var(--card));
                color: var(--green);
                font-family: var(--sans);
                font-size: 14px;
                font-weight: 600;
              "
            ></p>

            <p style="margin-top: 2px; color: var(--muted); font-size: 14px">
              obrigado por chegar mais perto. fica um pouco, a casa é tua.
            </p>

            <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 10px">
              <a href="/pages/conta/perfil.html" class="btn solid">ver minha conta</a>
              <a href="/pages/home.html" class="btn ghost">voltar pra casa</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer injetado pelo app.js -->
    <div id="site-footer"></div>

    <script type="module" src="../app.js"></script>
  </body>
</html>
