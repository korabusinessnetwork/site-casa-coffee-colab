<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>"
    />
    <title>Checkout cancelado, Casa Coffee Colab</title>
    <meta name="description" content="Tudo certo, a assinatura fica pra próxima. Passa aqui quando quiser." />
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!-- Header injetado pelo app.js -->
    <div id="site-header"></div>

    <main>
      <section class="section">
        <div class="wrap">
          <div
            class="reveal"
            style="max-width: 560px; margin: 0 auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px"
          >
            <span class="icon-badge lg coral">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 10h13v3a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z" />
                <path d="M17 11h2.2a2.3 2.3 0 0 1 0 4.6H17" />
                <path d="M8 3.5c-.6.8-.6 1.7 0 2.5M12 3.5c-.6.8-.6 1.7 0 2.5" />
              </svg>
            </span>
            <span class="eyebrow coral">Sem problema</span>

            <h1 class="title lg">fica pra próxima, então</h1>
            <p class="lede" style="max-width: 48ch">
              a gente não cobrou nada. teu plano, ou teu carrinho, continua te
              esperando aqui, sem pressa nenhuma. quando bater a vontade, é só voltar.
            </p>

            <p style="margin-top: 2px; color: var(--muted); font-size: 14px">
              enquanto isso, passa aqui pra um café? 💛
            </p>

            <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 10px">
              <a href="/pages/planos.html" class="btn solid">ver os planos de novo</a>
              <a href="/pages/home.html" class="btn ghost">voltar pra casa</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer injetado pelo app.js -->
    <div id="site-footer"></div>

    <script type="module" src="../app.js"></script>
  </body>
</html>
